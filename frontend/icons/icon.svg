<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Cálido -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E25828" />
      <stop offset="100%" stop-color="#9E2A0B" />
    </linearGradient>

    <!-- Brillo Interno -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F38346" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E25828" stop-opacity="0" />
    </radialGradient>

    <!-- Gradientes de la Hoja de Maíz -->
    <linearGradient id="huskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDAA2" />
      <stop offset="50%" stop-color="#D9B775" />
      <stop offset="100%" stop-color="#B28C46" />
    </linearGradient>

    <linearGradient id="huskShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A27D3B" />
      <stop offset="100%" stop-color="#785721" />
    </linearGradient>

    <!-- Masa y Salsa -->
    <linearGradient id="masaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE698" />
      <stop offset="100%" stop-color="#E0AA3E" />
    </linearGradient>

    <linearGradient id="salsaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9381E" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>

    <!-- Sombra del Tamal -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3A0800" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base del Ícono de la App -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" />
  <circle cx="256" cy="240" r="180" fill="url(#glow)" />

  <!-- Grupo Principal del Tamal Inclinado -->
  <g transform="translate(256, 275) rotate(-22)" filter="url(#shadow)">
    
    <!-- Vapor Superior -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.55" transform="rotate(22)">
      <path d="M -10 -210 C -25 -235, 0 -255, -15 -280" stroke-width="8" />
      <path d="M 25 -200 C 10 -225, 35 -245, 20 -270" stroke-width="7" />
      <path d="M -45 -195 C -60 -215, -40 -235, -55 -255" stroke-width="6" />
    </g>

    <!-- Doblez Trasero de la Hoja -->
    <path d="M -65 -60 C -85 -110, -60 -150, -20 -155 C 10 -155, 35 -130, 20 -90 Z" fill="url(#huskShadow)" stroke="#3E2312" stroke-width="7" stroke-linejoin="round" />

    <!-- Masa Expuesta -->
    <path d="M -50 -80 C -45 -135, 35 -135, 45 -75 C 20 -55, -25 -55, -50 -80 Z" fill="url(#masaGrad)" stroke="#3E2312" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Textura/Puntos de la Masa -->
    <circle cx="-15" cy="-95" r="3" fill="#B37D14" />
    <circle cx="10" cy="-105" r="4" fill="#B37D14" />
    <circle cx="25" cy="-80" r="3" fill="#B37D14" />
    <circle cx="-30" cy="-75" r="3.5" fill="#B37D14" />

    <!-- Salsa / Relleno Rojo -->
    <path d="M -20 -105 C -10 -125, 20 -120, 25 -100 C 15 -85, -10 -85, -20 -105 Z" fill="url(#salsaGrad)" />
    <path d="M -12 -110 C -5 -120, 12 -118, 15 -105 C 5 -95, -8 -95, -12 -110 Z" fill="#F05338" />
    <circle cx="5" cy="-100" r="2" fill="#7A0000" />

    <!-- Solapa Izquierda de la Hoja -->
    <path d="M -50 -75 C -95 -85, -115 -125, -70 -135 C -45 -115, -45 -85, -50 -75 Z" fill="url(#huskGrad)" stroke="#3E2312" stroke-width="7" stroke-linejoin="round" />

    <!-- Solapa Derecha de la Hoja -->
    <path d="M 40 -70 C 90 -75, 110 -110, 65 -125 C 40 -105, 35 -80, 40 -70 Z" fill="url(#huskGrad)" stroke="#3E2312" stroke-width="7" stroke-linejoin="round" />

    <!-- Cuerpo Delantero Envuelto -->
    <path d="M -65 -65 C -85 30, -50 145, -10 160 C 30 160, 65 130, 55 -60 C 20 -40, -35 -40, -65 -65 Z" fill="url(#huskGrad)" stroke="#3E2312" stroke-width="7" stroke-linejoin="round" />

    <!-- Líneas de Textura de la Hoja -->
    <g fill="none" stroke="#8C662B" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M -45 -45 C -60 30, -35 120, -10 150" />
      <path d="M -25 -40 C -35 30, -20 125, 0 153" />
      <path d="M 0 -38 C -5 30, 0 125, 12 153" />
      <path d="M 20 -40 C 20 30, 20 120, 25 148" />
      <path d="M 40 -45 C 45 20, 38 100, 35 135" />
    </g>

    <!-- Brillo de Luz -->
    <path d="M -55 -40 C -70 20, -45 100, -25 135" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.3" />

    <!-- Cuerda / Amarre Central -->
    <g stroke="#3E2312" stroke-linejoin="round">
      <path d="M -70 0 C -20 25, 30 20, 60 -10" fill="none" stroke="#261307" stroke-width="12" opacity="0.3" />
      <path d="M -71 -5 C -20 20, 25 15, 59 -12" fill="none" stroke="#E6C587" stroke-width="7" />
      <path d="M -70 8 C -20 33, 25 28, 57 2" fill="none" stroke="#D4AF66" stroke-width="7" />
      <path d="M -68 20 C -20 45, 25 40, 54 15" fill="none" stroke="#B89047" stroke-width="7" />

      <!-- Nudo y Lazos -->
      <circle cx="-10" cy="22" r="11" fill="#E6C587" />
      <path d="M -10 22 C -35 5, -55 25, -20 30 Z" fill="#D4AF66" />
      <path d="M -10 22 C 15 10, 35 35, 0 35 Z" fill="#D4AF66" />

      <!-- Tiras Colgantes -->
      <path d="M -12 28 C -25 55, -15 80, -22 100 C -15 85, -18 60, -8 30 Z" fill="#E6C587" />
      <path d="M -6 28 C 10 55, 5 80, 12 105 C 2 85, 2 60, -4 30 Z" fill="#D4AF66" />
    </g>

  </g>
</svg>